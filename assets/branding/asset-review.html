<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Asset Review — aegntic.ai</title>
<style>
  :root {
    --bg: #0a0a12;
    --surface: #14141f;
    --surface-hover: #1c1c2e;
    --border: #2a2a3d;
    --cyan: #00CFE5;
    --cyan-dim: rgba(0,207,229,0.15);
    --bronze: #CD7F32;
    --bronze-dim: rgba(205,127,50,0.15);
    --silver: #C0C0C0;
    --silver-dim: rgba(192,192,192,0.1);
    --red: #e74c5e;
    --red-dim: rgba(231,76,94,0.15);
    --green: #34d399;
    --green-dim: rgba(52,211,153,0.15);
    --text: #e8e8f0;
    --text-dim: #8888a0;
    --text-muted: #55556a;
    --radius: 12px;
    --radius-sm: 8px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.5;
  }

  /* ── Header ── */
  .header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(10,10,18,0.85);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border);
    padding: 16px 24px;
  }
  .header-inner {
    max-width: 1600px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }
  .header-title {
    display: flex;
    align-items: center;
    gap: 12px;
    white-space: nowrap;
  }
  .header-title h1 {
    font-size: 18px;
    font-weight: 600;
    letter-spacing: -0.02em;
  }
  .header-title h1 span { color: var(--cyan); }
  .badge {
    font-size: 11px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 99px;
    background: var(--cyan-dim);
    color: var(--cyan);
  }

  /* ── Stats bar ── */
  .stats {
    display: flex;
    gap: 16px;
    align-items: center;
  }
  .stat {
    font-size: 13px;
    color: var(--text-dim);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .stat-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    display: inline-block;
  }
  .stat-dot.pending { background: var(--text-muted); }
  .stat-dot.approved { background: var(--green); }
  .stat-dot.rejected { background: var(--red); }

  /* ── Controls ── */
  .controls {
    max-width: 1600px;
    margin: 0 auto;
    padding: 20px 24px 0;
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    align-items: center;
  }
  .search-box {
    flex: 1;
    min-width: 240px;
    position: relative;
  }
  .search-box svg {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-muted);
  }
  .search-box input {
    width: 100%;
    padding: 10px 12px 10px 38px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text);
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s;
  }
  .search-box input:focus { border-color: var(--cyan); }
  .search-box input::placeholder { color: var(--text-muted); }

  .filter-tabs {
    display: flex;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    overflow: hidden;
  }
  .filter-tab {
    padding: 8px 16px;
    font-size: 13px;
    font-weight: 500;
    color: var(--text-dim);
    cursor: pointer;
    border: none;
    background: none;
    transition: all 0.2s;
    white-space: nowrap;
  }
  .filter-tab:hover { color: var(--text); background: var(--surface-hover); }
  .filter-tab.active { color: var(--cyan); background: var(--cyan-dim); }

  .cat-select {
    padding: 9px 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text);
    font-size: 13px;
    outline: none;
    cursor: pointer;
  }
  .cat-select:focus { border-color: var(--cyan); }

  .bulk-actions {
    display: flex;
    gap: 8px;
    margin-left: auto;
  }

  /* ── Buttons ── */
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 14px;
    font-size: 13px;
    font-weight: 500;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    background: var(--surface);
    color: var(--text-dim);
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
  }
  .btn:hover { background: var(--surface-hover); color: var(--text); }
  .btn-approve { border-color: var(--green); color: var(--green); }
  .btn-approve:hover { background: var(--green-dim); }
  .btn-reject { border-color: var(--red); color: var(--red); }
  .btn-reject:hover { background: var(--red-dim); }
  .btn-cyan { border-color: var(--cyan); color: var(--cyan); }
  .btn-cyan:hover { background: var(--cyan-dim); }
  .btn-bronze { border-color: var(--bronze); color: var(--bronze); }
  .btn-bronze:hover { background: var(--bronze-dim); }
  .btn-sm { padding: 5px 10px; font-size: 12px; }

  /* ── Grid ── */
  .grid {
    max-width: 1600px;
    margin: 0 auto;
    padding: 20px 24px 40px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: 16px;
  }

  /* ── Card ── */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    transition: border-color 0.2s, transform 0.15s;
    display: flex;
    flex-direction: column;
  }
  .card:hover { border-color: #3a3a52; transform: translateY(-1px); }
  .card.approved { border-color: rgba(52,211,153,0.35); }
  .card.rejected { border-color: rgba(231,76,94,0.35); }

  .card-thumb {
    position: relative;
    aspect-ratio: 16/10;
    background: #0e0e1a;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .card-thumb img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    padding: 8px;
  }
  .card-thumb .video-placeholder {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    color: var(--text-muted);
  }
  .card-thumb .video-placeholder svg { opacity: 0.4; }
  .card-thumb .video-placeholder span { font-size: 12px; }

  .card-status-strip {
    position: absolute;
    top: 8px;
    left: 8px;
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    padding: 3px 8px;
    border-radius: 4px;
  }
  .card-status-strip.pending { background: var(--silver-dim); color: var(--silver); }
  .card-status-strip.approved { background: var(--green-dim); color: var(--green); }
  .card-status-strip.rejected { background: var(--red-dim); color: var(--red); }

  .card-type-badge {
    position: absolute;
    top: 8px;
    right: 8px;
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    padding: 3px 8px;
    border-radius: 4px;
    background: rgba(0,0,0,0.5);
    color: var(--cyan);
  }

  .card-body { padding: 14px; flex: 1; display: flex; flex-direction: column; gap: 8px; }
  .card-name {
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
    line-height: 1.3;
    word-break: break-word;
  }
  .card-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .card-tag {
    font-size: 11px;
    padding: 2px 7px;
    border-radius: 4px;
    background: var(--cyan-dim);
    color: var(--cyan);
    font-weight: 500;
  }
  .card-tag.video { background: var(--bronze-dim); color: var(--bronze); }
  .card-info {
    font-size: 12px;
    color: var(--text-dim);
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
  }
  .card-usage {
    font-size: 12px;
    color: var(--text-muted);
    line-height: 1.4;
  }
  .card-path {
    font-size: 11px;
    color: var(--text-muted);
    font-family: 'SF Mono', 'Fira Code', monospace;
    word-break: break-all;
    opacity: 0.7;
  }

  .card-notes {
    margin-top: auto;
  }
  .card-notes textarea {
    width: 100%;
    padding: 8px 10px;
    background: rgba(0,0,0,0.25);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-size: 12px;
    font-family: inherit;
    resize: vertical;
    min-height: 48px;
    max-height: 120px;
    outline: none;
    transition: border-color 0.2s;
  }
  .card-notes textarea:focus { border-color: var(--cyan); }
  .card-notes textarea::placeholder { color: var(--text-muted); }

  .card-actions {
    display: flex;
    gap: 6px;
    padding-top: 8px;
    border-top: 1px solid var(--border);
  }
  .card-actions .btn { flex: 1; justify-content: center; }

  /* ── Empty state ── */
  .empty {
    grid-column: 1 / -1;
    text-align: center;
    padding: 80px 20px;
    color: var(--text-muted);
  }
  .empty svg { margin-bottom: 16px; opacity: 0.3; }
  .empty p { font-size: 15px; }
  .empty .hint { font-size: 13px; margin-top: 8px; }

  /* ── Drop zone ── */
  .drop-overlay {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 999;
    background: rgba(0,207,229,0.06);
    border: 3px dashed var(--cyan);
    align-items: center;
    justify-content: center;
    font-size: 18px;
    color: var(--cyan);
    font-weight: 600;
    pointer-events: none;
  }
  .drop-overlay.visible { display: flex; }

  /* ── Toast ── */
  .toast {
    position: fixed;
    bottom: 24px;
    right: 24px;
    padding: 12px 20px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text);
    font-size: 13px;
    z-index: 200;
    opacity: 0;
    transform: translateY(10px);
    transition: all 0.3s;
    pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateY(0); }

  /* ── Lightbox ── */
  .lightbox {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 300;
    background: rgba(0,0,0,0.9);
    align-items: center;
    justify-content: center;
    cursor: zoom-out;
  }
  .lightbox.open { display: flex; }
  .lightbox img {
    max-width: 95vw;
    max-height: 95vh;
    object-fit: contain;
    border-radius: 8px;
  }

  /* ── Responsive ── */
  @media (max-width: 768px) {
    .grid { grid-template-columns: 1fr; }
    .controls { padding: 12px 16px 0; }
    .header { padding: 12px 16px; }
    .grid { padding: 12px 16px 32px; }
    .bulk-actions { margin-left: 0; width: 100%; }
    .header-inner { gap: 8px; }
    .stats { display: none; }
  }
</style>
</head>
<body>

<div class="drop-overlay" id="dropOverlay">Drop JSON manifest here</div>
<div class="lightbox" id="lightbox" onclick="closeLightbox()">
  <img id="lightboxImg" src="" alt="">
</div>
<div class="toast" id="toast"></div>

<header class="header">
  <div class="header-inner">
    <div class="header-title">
      <h1>Asset <span>Review</span></h1>
      <span class="badge" id="totalBadge">0 assets</span>
    </div>
    <div class="stats">
      <span class="stat"><span class="stat-dot pending"></span> <span id="pendingCount">0</span> pending</span>
      <span class="stat"><span class="stat-dot approved"></span> <span id="approvedCount">0</span> approved</span>
      <span class="stat"><span class="stat-dot rejected"></span> <span id="rejectedCount">0</span> rejected</span>
    </div>
  </div>
</header>

<div class="controls">
  <div class="search-box">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    <input type="text" id="search" placeholder="Search assets by name, path, notes..." oninput="render()">
  </div>

  <div class="filter-tabs" id="filterTabs">
    <button class="filter-tab active" data-filter="all">All</button>
    <button class="filter-tab" data-filter="pending">Pending</button>
    <button class="filter-tab" data-filter="approved">Approved</button>
    <button class="filter-tab" data-filter="rejected">Rejected</button>
  </div>

  <select class="cat-select" id="catFilter" onchange="render()">
    <option value="all">All Categories</option>
  </select>

  <div class="bulk-actions">
    <button class="btn btn-approve btn-sm" onclick="bulkAction('approved')">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6 9 17l-5-5"/></svg>
      Approve visible
    </button>
    <button class="btn btn-reject btn-sm" onclick="bulkAction('rejected')">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
      Reject visible
    </button>
    <button class="btn btn-cyan btn-sm" onclick="exportApproved()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
      Export approved
    </button>
    <button class="btn btn-bronze btn-sm" onclick="resetAll()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>
      Reset all
    </button>
    <button class="btn btn-sm" id="toggleExcluded" onclick="toggleExcluded()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
      Show non-aegntic
    </button>
  </div>
</div>

<div class="grid" id="grid"></div>

<script>
const STORAGE_KEY = 'aegntic-asset-review-decisions';
const MANIFEST_IMAGES = 'ae-brand-manifest.json';
const MANIFEST_VIDEOS = 'ae-video-manifest.json';

let assets = [];
let decisions = {};

// ── Persistence ──
function loadDecisions() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    decisions = raw ? JSON.parse(raw) : {};
  } catch { decisions = {}; }
}
function saveDecisions() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(decisions));
}

// ── Data loading ──
async function loadManifests() {
  // Try fetch first (works on http://), fall back to embedded JSON (works on file://)
  let imageAssets = [], videoAssets = [];
  try {
    const results = await Promise.allSettled([
      fetch(MANIFEST_IMAGES).then(r => r.json()),
      fetch(MANIFEST_VIDEOS).then(r => r.json())
    ]);
    imageAssets = results[0].status === 'fulfilled' ? results[0].value : null;
    videoAssets = results[1].status === 'fulfilled' ? results[1].value : null;
  } catch {}

  // Fallback to embedded <script type="application/json"> blocks
  if (!imageAssets) {
    try { imageAssets = JSON.parse(document.getElementById('manifest-images').textContent); } catch { imageAssets = []; }
  }
  if (!videoAssets) {
    try { videoAssets = JSON.parse(document.getElementById('manifest-videos').textContent); } catch { videoAssets = []; }
  }

  assets = [
    ...imageAssets.map(a => ({ ...a, _type: 'image' })),
    ...videoAssets.map(a => ({ ...a, _type: 'video' }))
  ];
}

// ── Thumbnail resolution ──
// Pre-computed thumb filename lookup (maps asset.id → actual .jpg filename in thumbs/)
const THUMB_MAP = {};
(function buildThumbMap() {
  // Thumbnails on disk: listed by name used in the generate step
  // Asset names may have extensions (.png, .jpg) that are stripped for the thumb filename
  // Build the map from the actual thumbs directory listing
  const thumbFiles = [
    "about-mesh","ae-logo","ae-logos1-flux2@1024x1024","ae-logos1-nb3p@1024x1024",
    "ae-logos2-nb3p@1024x1024","ae-vogue-title","aegntic_glass_editorial_slide_cover_16x9",
    "aegntic_glass_editorial_slide_metrics_16x9","aegntic_glass_editorial_slide_system_map_16x9",
    "aegntic_glass_editorial_styleguide_a4","aegnticai (4k)","aegnticai-jpg","aegnticai",
    "aegnticdotai-heading-logo","aegnticdotai-onepage","autoclaw-icon","claw-logo-source-approved",
    "clawreform-icon-logo-2k","clawreform-icon-logo","clawreform-logo-backgrounded",
    "clawreform-logo-source-v2","clawreform-logo-v2","clawreform-logo","clawreform-logo2",
    "clawreform-long-logo-nobg","clawreform-long-logo-sluts","clawreform-long-logo",
    "clawreform-mark-v2","clawreform5","glass-waveform","hero-sculpture","hero-typography",
    "logo-lockup-master-transparent","logo-master-transparent","logo_aegnt27_1765002376575",
    "logo_d3mo_1765002436051","logo_fpef_1765002334864","logo_obs_1765002454644",
    "logo_prologue_1765002393629","logo_stoa_suite","logo_ultraplan_1765002300581",
    "logo_viral27_1765002355285","research-crystal","vogue-ae"
  ];
  thumbFiles.forEach(f => THUMB_MAP[f] = f + '.jpg');
})();

function thumbPath(asset) {
  if (asset._type === 'video') return null;
  const name = asset.name;
  // Special collision: ae-015 "aegnticai" (jpg) vs ae-014 "aegnticai" (png)
  if (asset.id === 'ae-015') return 'thumbs/aegnticai-jpg.jpg';
  // Strip extension from name to match thumb filename
  const base = name.replace(/\.\w+$/, '');
  // Try exact base match, then try full name as-is
  if (THUMB_MAP[base]) return 'thumbs/' + THUMB_MAP[base];
  if (THUMB_MAP[name]) return 'thumbs/' + THUMB_MAP[name];
  return null;
}

function thumbFallback(asset) {
  return `data:image/svg+xml,${encodeURIComponent(
    `<svg xmlns="http://www.w3.org/2000/svg" width="340" height="212" fill="#0e0e1a">
      <rect width="340" height="212"/>
      <text x="170" y="106" text-anchor="middle" fill="#555" font-family="sans-serif" font-size="13">${asset.format?.toUpperCase() || 'IMG'}</text>
      <text x="170" y="126" text-anchor="middle" fill="#444" font-family="sans-serif" font-size="11">${asset.width || '?'} x ${asset.height || '?'}</text>
    </svg>`
  )}`;
}

// ── Formatting ──
function fmtSize(bytes) {
  if (!bytes) return '—';
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
  return (bytes / 1048576).toFixed(1) + ' MB';
}
function fmtDuration(sec) {
  if (!sec) return '—';
  if (sec < 60) return sec.toFixed(1) + 's';
  const m = Math.floor(sec / 60);
  const s = (sec % 60).toFixed(0);
  return m + ':' + s.padStart(2, '0');
}

// ── Filtering ──
function getFiltered() {
  const search = document.getElementById('search').value.toLowerCase().trim();
  const status = document.querySelector('.filter-tab.active')?.dataset.filter || 'all';
  const cat = document.getElementById('catFilter').value;

  return assets.filter(a => {
    // Hide non-aegntic categories unless toggled on
    if (!showExcluded && EXCLUDED_CATEGORIES.has(a.category)) return false;

    const d = decisions[a.id] || {};
    const st = d.status || mapOriginalStatus(a.status);

    if (status !== 'all' && st !== status) return false;
    if (cat !== 'all' && a.category !== cat) return false;
    if (search) {
      const hay = [a.name, a.path, a.id, a.category, a.suggested_usage || '', d.notes || ''].join(' ').toLowerCase();
      if (!hay.includes(search)) return false;
    }
    return true;
  });
}

// Categories that belong to other projects, not aegntic.ai
const EXCLUDED_CATEGORIES = new Set([
  'clawreform-brand', 'clawreform-icon', 'clawreform-long', 'apac-reference'
]);
let showExcluded = false;

function mapOriginalStatus(s) {
  if (!s) return 'pending';
  if (s === 'approved') return 'approved';
  if (s === 'rejected') return 'rejected';
  if (s === 'production-ready' || s === 'active') return 'approved';
  if (s === 'reference' || s === 'reference-only') return 'rejected';
  // active, concept, needs-resize, needs-upscale, needs-crop, needs-conversion
  return 'pending';
}

// ── Rendering ──
function render() {
  const filtered = getFiltered();
  const grid = document.getElementById('grid');

  if (!filtered.length) {
    grid.innerHTML = `<div class="empty">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <p>No assets match your filters</p>
      <p class="hint">Try adjusting search, status, or category filters</p>
    </div>`;
    updateStats();
    return;
  }

  grid.innerHTML = filtered.map(a => {
    const d = decisions[a.id] || {};
    const status = d.status || mapOriginalStatus(a.status);
    const notes = d.notes || '';
    const thumb = thumbPath(a);
    const isVideo = a._type === 'video';
    const dims = a.width ? `${a.width}x${a.height}` : (a.resolution || '—');

    return `<div class="card ${status}" data-id="${a.id}">
      <div class="card-thumb">
        ${isVideo ? `<div class="video-placeholder">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polygon points="5 3 19 12 5 21 5 3"/></svg>
          <span>${a.format?.toUpperCase() || 'VIDEO'}</span>
        </div>` : `<img src="${thumb}" alt="${a.name}" loading="lazy" onerror="this.src='${thumbFallback(a)}'" onclick="openLightbox('${thumb}')" style="cursor:zoom-in">`}
        <span class="card-status-strip ${status}">${status}</span>
        <span class="card-type-badge ${isVideo ? 'video' : ''}">${isVideo ? (a.format || 'video').toUpperCase() : (a.format || 'img').toUpperCase()}</span>
      </div>
      <div class="card-body">
        <div class="card-name">${escHtml(a.name)}</div>
        <div class="card-meta">
          <span class="card-tag">${escHtml(a.category)}</span>
        </div>
        <div class="card-info">
          <span>${fmtSize(a.size_bytes)}</span>
          <span>${dims}</span>
          ${isVideo && a.duration_seconds ? `<span>${fmtDuration(a.duration_seconds)}</span>` : ''}
        </div>
        <div class="card-usage">${escHtml(a.suggested_usage || '')}</div>
        <div class="card-path">${escHtml(a.path)}</div>
        <div class="card-notes">
          <textarea placeholder="Add notes..." oninput="updateNote('${a.id}', this.value)">${escHtml(notes)}</textarea>
        </div>
        <div class="card-actions">
          <button class="btn btn-approve btn-sm" onclick="setStatus('${a.id}','approved')">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6 9 17l-5-5"/></svg>
            Approve
          </button>
          <button class="btn btn-reject btn-sm" onclick="setStatus('${a.id}','rejected')">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6 6 18M6 6l12 12"/></svg>
            Reject
          </button>
          <button class="btn btn-sm" onclick="setStatus('${a.id}','pending')">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg>
            Reset
          </button>
        </div>
      </div>
    </div>`;
  }).join('');

  updateStats();
}

function escHtml(s) {
  const d = document.createElement('div');
  d.textContent = s || '';
  return d.innerHTML;
}

// ── Stats ──
function updateStats() {
  let pending = 0, approved = 0, rejected = 0;
  assets.forEach(a => {
    const st = (decisions[a.id]?.status) || mapOriginalStatus(a.status);
    if (st === 'approved') approved++;
    else if (st === 'rejected') rejected++;
    else pending++;
  });
  document.getElementById('pendingCount').textContent = pending;
  document.getElementById('approvedCount').textContent = approved;
  document.getElementById('rejectedCount').textContent = rejected;
  document.getElementById('totalBadge').textContent = assets.length + ' assets';
}

// ── Category population ──
function populateCategories() {
  const cats = [...new Set(
    assets.filter(a => showExcluded || !EXCLUDED_CATEGORIES.has(a.category))
         .map(a => a.category)
  )].sort();
  const sel = document.getElementById('catFilter');
  sel.innerHTML = '<option value="all">All Categories</option>' +
    cats.map(c => `<option value="${escHtml(c)}">${escHtml(c)}</option>`).join('');
}

// ── Actions ──
function setStatus(id, status) {
  if (!decisions[id]) decisions[id] = {};
  decisions[id].status = status;
  saveDecisions();
  render();
}

function updateNote(id, text) {
  if (!decisions[id]) decisions[id] = {};
  decisions[id].notes = text;
  saveDecisions();
}

function bulkAction(status) {
  const filtered = getFiltered();
  let count = 0;
  filtered.forEach(a => {
    if (!decisions[a.id]) decisions[a.id] = {};
    decisions[a.id].status = status;
    count++;
  });
  saveDecisions();
  render();
  showToast(`${count} assets ${status}`);
}

function resetAll() {
  if (!confirm('Reset all review decisions? This cannot be undone.')) return;
  decisions = {};
  saveDecisions();
  render();
  showToast('All decisions reset');
}

function toggleExcluded() {
  showExcluded = !showExcluded;
  const btn = document.getElementById('toggleExcluded');
  btn.textContent = showExcluded ? 'Hide non-aegntic' : ' Show non-aegntic';
  if (showExcluded) btn.style.borderColor = 'var(--text-muted)';
  else btn.style.borderColor = '';
  populateCategories();
  render();
}

// ── Export ──
function exportApproved() {
  const approved = assets.filter(a => {
    const st = (decisions[a.id]?.status) || mapOriginalStatus(a.status);
    return st === 'approved';
  });
  if (!approved.length) {
    showToast('No approved assets to export');
    return;
  }

  const exportData = approved.map(a => {
    const d = decisions[a.id] || {};
    const out = { ...a };
    out.review_status = 'approved';
    out.review_notes = d.notes || '';
    delete out._type;
    return out;
  });

  const json = JSON.stringify(exportData, null, 2);

  // Copy to clipboard
  navigator.clipboard.writeText(json).then(() => {
    showToast(`${approved.length} approved assets copied + downloading JSON`);
  }).catch(() => {
    showToast(`Downloading ${approved.length} approved assets`);
  });

  // Download
  const blob = new Blob([json], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'ae-approved-assets.json';
  a.click();
  URL.revokeObjectURL(url);
}

// ── Lightbox ──
function openLightbox(src) {
  const lb = document.getElementById('lightbox');
  document.getElementById('lightboxImg').src = src;
  lb.classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  document.body.style.overflow = '';
}
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeLightbox();
});

// ── Toast ──
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 2500);
}

// ── Filter tabs ──
document.getElementById('filterTabs').addEventListener('click', e => {
  const tab = e.target.closest('.filter-tab');
  if (!tab) return;
  document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
  tab.classList.add('active');
  render();
});

// ── Drag and drop ──
let dragCounter = 0;
document.addEventListener('dragenter', e => { e.preventDefault(); dragCounter++; document.getElementById('dropOverlay').classList.add('visible'); });
document.addEventListener('dragleave', e => { e.preventDefault(); dragCounter--; if (dragCounter <= 0) { dragCounter = 0; document.getElementById('dropOverlay').classList.remove('visible'); } });
document.addEventListener('dragover', e => e.preventDefault());
document.addEventListener('drop', async e => {
  e.preventDefault();
  dragCounter = 0;
  document.getElementById('dropOverlay').classList.remove('visible');
  const file = e.dataTransfer.files[0];
  if (!file || !file.name.endsWith('.json')) {
    showToast('Please drop a JSON manifest file');
    return;
  }
  try {
    const text = await file.text();
    const data = JSON.parse(text);
    if (!Array.isArray(data)) throw new Error('Expected array');
    const newAssets = data.map(a => ({ ...a, _type: a.format === 'mp4' || a.format === 'webm' || a.format === 'mov' || a.duration_seconds ? 'video' : 'image' }));
    const before = assets.length;
    // Dedupe by id
    const existingIds = new Set(assets.map(a => a.id));
    newAssets.forEach(a => { if (!existingIds.has(a.id)) assets.push(a); });
    const added = assets.length - before;
    populateCategories();
    render();
    showToast(`Loaded ${file.name}: ${added} new assets`);
  } catch (err) {
    showToast('Failed to parse JSON: ' + err.message);
  }
});

// ── Init ──
async function init() {
  loadDecisions();
  await loadManifests();
  populateCategories();
  render();
}
init();
</script>
