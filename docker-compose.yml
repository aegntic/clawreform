# NOTE: Build from source using `docker compose up --build`, or pull from GHCR once published.
# Repository: https://github.com/aegntic/clawreform

version: "3.8"
services:
  clawreform:
    build: .
    # image: ghcr.io/aegntic/clawreform:latest  # Uncomment when GHCR is public
    ports:
      - "4332:4332"
    volumes:
      - clawreform-data:/data
    environment:
      # Passthrough host env vars only when set (avoids empty strings shadowing /data/.clawreform/.env)
      - ANTHROPIC_API_KEY
      - OPENAI_API_KEY
      - GROQ_API_KEY
      - OPENROUTER_API_KEY
      - GEMINI_API_KEY
      - DEEPSEEK_API_KEY
      - XAI_API_KEY
      - ZHIPU_API_KEY
      - TELEGRAM_BOT_TOKEN
      - DISCORD_BOT_TOKEN
      - SLACK_BOT_TOKEN
      - SLACK_APP_TOKEN
    restart: unless-stopped

volumes:
  clawreform-data:
