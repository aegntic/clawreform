<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img" viewBox="0 0 960 540"><title>AgentDNA stores the identity of an agent as files.</title><desc>An arrow leads from the agent manifest (agent.toml) to the kernel, which generates identity files in the Behaviour, Doctrine and Memory views groups, and the files are read back as the agent context.</desc><defs><marker id="arrow" markerHeight="8" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="10" refY="4" viewBox="0 0 10 8"><path fill="#F0A23C" d="M0,0 L10,4 L0,8 Z"/></marker></defs><rect width="960" height="540" x="0" y="0" fill="#14171C"/><text x="24" y="46" fill="#E6E9EF" font-size="22" font-weight="bold">AgentDNA: identity stored as files</text><g fill="#1C2027" fill-opacity=".55" stroke="#2A303A"><rect width="468" height="114" x="264" y="60" rx="8"/><rect width="468" height="114" x="264" y="204" rx="8"/><rect width="468" height="114" x="264" y="342" rx="8"/></g><g fill="#E6E9EF" font-size="14" font-weight="bold"><text x="276" y="80">Behaviour</text><text x="276" y="224">Doctrine</text><text x="276" y="362">Memory views</text></g><g><rect width="140" height="34" x="276" y="90" fill="#1C2027" stroke="#2A303A" rx="8"/><text x="346" y="112" fill="#E6E9EF" font-size="14" text-anchor="middle">IDENTITY.md</text></g><g><rect width="140" height="34" x="428" y="90" fill="#1C2027" stroke="#2A303A" rx="8"/><text x="498" y="112" fill="#E6E9EF" font-size="14" text-anchor="middle">SOUL.md</text></g><g><rect width="140" height="34" x="580" y="90" fill="#1C2027" stroke="#2A303A" rx="8"/><text x="650" y="112" fill="#E6E9EF" font-size="14" text-anchor="middle">BOOTSTRAP.md</text></g><g><rect width="140" height="34" x="276" y="132" fill="#1C2027" stroke="#2A303A" rx="8"/><text x="346" y="154" fill="#E6E9EF" font-size="14" text-anchor="middle">USER.md</text></g><g><rect width="140" height="34" x="428" y="132" fill="#1C2027" stroke="#9AA4B2" stroke-dasharray="5 4" rx="8"/><text x="498" y="154" fill="#E6E9EF" font-size="14" text-anchor="middle">HEARTBEAT.md</text></g><g><rect width="140" height="34" x="276" y="234" fill="#1C2027" stroke="#2A303A" rx="8"/><text x="346" y="256" fill="#E6E9EF" font-size="14" text-anchor="middle">HANDS.md</text></g><g><rect width="140" height="34" x="428" y="234" fill="#1C2027" stroke="#2A303A" rx="8"/><text x="498" y="256" fill="#E6E9EF" font-size="14" text-anchor="middle">SKILLS.md</text></g><g><rect width="140" height="34" x="580" y="234" fill="#1C2027" stroke="#2A303A" rx="8"/><text x="650" y="256" fill="#E6E9EF" font-size="14" text-anchor="middle">TOOLS.md</text></g><g><rect width="140" height="34" x="276" y="276" fill="#1C2027" stroke="#2A303A" rx="8"/><text x="346" y="298" fill="#E6E9EF" font-size="14" text-anchor="middle">AGENTS.md</text></g><g><rect width="140" height="34" x="428" y="276" fill="#1C2027" stroke="#2A303A" rx="8"/><text x="498" y="298" fill="#E6E9EF" font-size="14" text-anchor="middle">MEMORY.md</text></g><g><rect width="140" height="34" x="276" y="372" fill="#1C2027" stroke="#2A303A" rx="8"/><text x="346" y="394" fill="#E6E9EF" font-size="14" text-anchor="middle">CORE.md</text></g><g><rect width="140" height="34" x="428" y="372" fill="#1C2027" stroke="#2A303A" rx="8"/><text x="498" y="394" fill="#E6E9EF" font-size="14" text-anchor="middle">OVERVIEW.md</text></g><g><rect width="140" height="34" x="580" y="372" fill="#1C2027" stroke="#2A303A" rx="8"/><text x="650" y="394" fill="#E6E9EF" font-size="14" text-anchor="middle">PROJECT.md</text></g><g><rect width="140" height="34" x="276" y="414" fill="#1C2027" stroke="#2A303A" rx="8"/><text x="346" y="436" fill="#E6E9EF" font-size="14" text-anchor="middle">COLLECTIVE.md</text></g><g><rect width="172" height="52" x="24" y="139" fill="#F0A23C" fill-opacity=".1" stroke="#F0A23C" stroke-width="1.5" rx="8"/><text x="110" y="160" fill="#E6E9EF" font-size="14" text-anchor="middle">Agent manifest</text><text x="110" y="179" fill="#9AA4B2" font-size="12" text-anchor="middle">agent.toml</text></g><g><rect width="172" height="52" x="24" y="235" fill="#1C2027" stroke="#2A303A" rx="8"/><text x="110" y="256" fill="#E6E9EF" font-size="14" text-anchor="middle">Kernel</text><text x="110" y="275" fill="#9AA4B2" font-size="12" text-anchor="middle">generate_identity_files</text></g><g><rect width="136" height="52" x="800" y="235" fill="#1C2027" stroke="#2A303A" rx="8"/><text x="868" y="256" fill="#E6E9EF" font-size="14" text-anchor="middle">Agent context</text><text x="868" y="275" fill="#9AA4B2" font-size="12" text-anchor="middle">read_identity_file</text></g><path fill="none" stroke="#F0A23C" stroke-width="2" d="M230,117 V399 M732,117 H766 M732,399 H766 M766,117 V399"/><g fill="none" stroke="#F0A23C" stroke-width="2" marker-end="url(#arrow)"><path d="M110,191 V235"/><path d="M230,117 H264"/><path d="M196,261 H264"/><path d="M230,399 H264"/><path d="M732,261 H800"/></g><text x="276" y="191" fill="#9AA4B2" font-size="12">HEARTBEAT.md is generated only for autonomous agents</text><g fill="#9AA4B2" font-size="12"><text x="24" y="480">The kernel loads the files in a fixed order on each turn.</text><text x="24" y="500">Edit a file and the agent changes on its next turn. Git can track each change.</text></g></svg>