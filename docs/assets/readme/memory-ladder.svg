<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <title>Five memory tiers rise toward CORE.md, and a confidence score shows when a claim is ready.</title>
  <desc>Amber arrows go up from Working memory to PROJECT.md and from PROJECT.md to OVERVIEW.md but stop before CORE.md, and two panels give the confidence formula and the conditions that make a claim ready.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 8" refX="10" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#F0A23C"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="640" fill="#14171C"/>
  <text x="24" y="46" font-size="22" font-weight="bold" fill="#E6E9EF">Memory ladder and collective confidence</text>

  <!-- Upward flow along the left slope of the ladder -->
  <g fill="none" stroke="#F0A23C" stroke-width="2" marker-end="url(#arrow)">
    <path d="M142,554 L172,346"/>
    <path d="M176.3,316 L187,242"/>
  </g>

  <!-- Ladder, narrowest at the top -->
  <g>
    <rect x="226" y="88" width="200" height="88" rx="8" fill="#1C2027" stroke="#9AA4B2" stroke-width="1.5"/>
    <text x="326" y="116" text-anchor="middle" font-size="14" fill="#E6E9EF">CORE.md</text>
    <text text-anchor="middle" font-size="12" fill="#9AA4B2"><tspan x="326" y="137">Durable truths.</tspan><tspan x="326" y="156">A human reviews changes.</tspan></text>
  </g>
  <g>
    <rect x="211" y="204" width="230" height="76" rx="8" fill="#1C2027" stroke="#2A303A"/>
    <text x="326" y="236" text-anchor="middle" font-size="14" fill="#E6E9EF">OVERVIEW.md</text>
    <text x="326" y="257" text-anchor="middle" font-size="12" fill="#9AA4B2">Direction across projects</text>
  </g>
  <g>
    <rect x="196" y="308" width="260" height="76" rx="8" fill="#1C2027" stroke="#2A303A"/>
    <text x="326" y="340" text-anchor="middle" font-size="14" fill="#E6E9EF">PROJECT.md</text>
    <text x="326" y="361" text-anchor="middle" font-size="12" fill="#9AA4B2">Truths ratified for one project</text>
  </g>
  <g>
    <rect x="181" y="412" width="290" height="76" rx="8" fill="#1C2027" stroke="#2A303A"/>
    <text x="326" y="444" text-anchor="middle" font-size="14" fill="#E6E9EF">COLLECTIVE.md and ledger.json</text>
    <text x="326" y="465" text-anchor="middle" font-size="12" fill="#9AA4B2">Claims from all agents</text>
  </g>
  <g>
    <rect x="166" y="516" width="320" height="76" rx="8" fill="#1C2027" stroke="#2A303A"/>
    <text x="326" y="548" text-anchor="middle" font-size="14" fill="#E6E9EF">Working memory</text>
    <text x="326" y="569" text-anchor="middle" font-size="12" fill="#9AA4B2">Hot, temporary context</text>
  </g>

  <!-- Note beside CORE.md -->
  <text font-size="12" fill="#9AA4B2" text-anchor="end"><tspan x="212" y="127">The system marks candidates.</tspan><tspan x="212" y="146">It does not write this file.</tspan></text>

  <!-- Confidence formula -->
  <rect x="544" y="88" width="392" height="268" rx="8" fill="#1C2027" fill-opacity="0.55" stroke="#2A303A"/>
  <text x="562" y="124" font-size="14" font-weight="bold" fill="#E6E9EF">How confidence is calculated</text>
  <g font-size="13" fill="#E6E9EF" font-family="ui-monospace, 'Cascadia Code', Consolas, monospace">
    <text x="562" y="162">confidence = 0.20</text>
    <text x="578" y="196">+ 0.11 x dispatch mentions (max 4)</text>
    <text x="578" y="230">+ 0.14 x summary mentions (max 4)</text>
    <text x="578" y="264">+ 0.08 x extra evidence (max 0.24)</text>
    <text x="578" y="298">+ 0.20 if in both sources</text>
    <text x="562" y="332">capped at 0.99</text>
  </g>

  <!-- Readiness conditions -->
  <rect x="544" y="380" width="392" height="212" rx="8" fill="#1C2027" fill-opacity="0.55" stroke="#2A303A"/>
  <text x="562" y="416" font-size="14" font-weight="bold" fill="#E6E9EF">When a claim is ready</text>
  <circle cx="568" cy="452.5" r="5" fill="#7CCB8C"/>
  <text x="584" y="457" font-size="12" fill="#E6E9EF">PROJECT: confidence 0.45 or more, 1 evidence</text>
  <circle cx="568" cy="494.5" r="5" fill="#7CCB8C"/>
  <text x="584" y="499" font-size="12" fill="#E6E9EF">OVERVIEW: confidence 0.70 or more, in both sources</text>
  <circle cx="568" cy="541" r="5" fill="#F0A23C"/>
  <text font-size="12" fill="#E6E9EF"><tspan x="584" y="536">CORE candidate: confidence 0.90 or more,</tspan><tspan x="584" y="555">4 evidence, 2 dispatch, 2 summary</tspan></text>
</svg>
