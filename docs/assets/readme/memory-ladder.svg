<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img" viewBox="0 0 960 640"><title>Five memory tiers rise toward CORE.md, and a confidence score shows when a claim is ready.</title><desc>Amber arrows go up from Working memory to PROJECT.md and from PROJECT.md to OVERVIEW.md but stop before CORE.md, and two panels give the confidence formula and the conditions that make a claim ready.</desc><defs><marker id="arrow" markerHeight="8" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="10" refY="4" viewBox="0 0 10 8"><path fill="#F0A23C" d="M0,0 L10,4 L0,8 Z"/></marker></defs><rect width="960" height="640" x="0" y="0" fill="#14171C"/><text x="24" y="46" fill="#E6E9EF" font-size="22" font-weight="bold">Memory ladder and collective confidence</text><g fill="none" stroke="#F0A23C" stroke-width="2" marker-end="url(#arrow)"><path d="M142,554 L172,346"/><path d="M176.3,316 L187,242"/></g><g><rect width="200" height="88" x="226" y="88" fill="#1C2027" stroke="#9AA4B2" stroke-width="1.5" rx="8"/><text x="326" y="116" fill="#E6E9EF" font-size="14" text-anchor="middle">CORE.md</text><text fill="#9AA4B2" font-size="12" text-anchor="middle"><tspan x="326" y="137">Durable truths.</tspan><tspan x="326" y="156">A human reviews changes.</tspan></text></g><g><rect width="230" height="76" x="211" y="204" fill="#1C2027" stroke="#2A303A" rx="8"/><text x="326" y="236" fill="#E6E9EF" font-size="14" text-anchor="middle">OVERVIEW.md</text><text x="326" y="257" fill="#9AA4B2" font-size="12" text-anchor="middle">Direction across projects</text></g><g><rect width="260" height="76" x="196" y="308" fill="#1C2027" stroke="#2A303A" rx="8"/><text x="326" y="340" fill="#E6E9EF" font-size="14" text-anchor="middle">PROJECT.md</text><text x="326" y="361" fill="#9AA4B2" font-size="12" text-anchor="middle">Truths ratified for one project</text></g><g><rect width="290" height="76" x="181" y="412" fill="#1C2027" stroke="#2A303A" rx="8"/><text x="326" y="444" fill="#E6E9EF" font-size="14" text-anchor="middle">COLLECTIVE.md and ledger.json</text><text x="326" y="465" fill="#9AA4B2" font-size="12" text-anchor="middle">Claims from all agents</text></g><g><rect width="320" height="76" x="166" y="516" fill="#1C2027" stroke="#2A303A" rx="8"/><text x="326" y="548" fill="#E6E9EF" font-size="14" text-anchor="middle">Working memory</text><text x="326" y="569" fill="#9AA4B2" font-size="12" text-anchor="middle">Hot, temporary context</text></g><text fill="#9AA4B2" font-size="12" text-anchor="end"><tspan x="212" y="127">The system marks candidates.</tspan><tspan x="212" y="146">It does not write this file.</tspan></text><rect width="392" height="268" x="544" y="88" fill="#1C2027" fill-opacity=".55" stroke="#2A303A" rx="8"/><text x="562" y="124" fill="#E6E9EF" font-size="14" font-weight="bold">How confidence is calculated</text><g fill="#E6E9EF" font-family="ui-monospace, 'Cascadia Code', Consolas, monospace" font-size="13"><text x="562" y="162">confidence = 0.20</text><text x="578" y="196">+ 0.11 x dispatch mentions (max 4)</text><text x="578" y="230">+ 0.14 x summary mentions (max 4)</text><text x="578" y="264">+ 0.08 x extra evidence (max 0.24)</text><text x="578" y="298">+ 0.20 if in both sources</text><text x="562" y="332">capped at 0.99</text></g><rect width="392" height="212" x="544" y="380" fill="#1C2027" fill-opacity=".55" stroke="#2A303A" rx="8"/><text x="562" y="416" fill="#E6E9EF" font-size="14" font-weight="bold">When a claim is ready</text><circle cx="568" cy="452.5" r="5" fill="#7CCB8C"/><text x="584" y="457" fill="#E6E9EF" font-size="12">PROJECT: confidence 0.45 or more, 1 evidence</text><circle cx="568" cy="494.5" r="5" fill="#7CCB8C"/><text x="584" y="499" fill="#E6E9EF" font-size="12">OVERVIEW: confidence 0.70 or more, in both sources</text><circle cx="568" cy="541" r="5" fill="#F0A23C"/><text fill="#E6E9EF" font-size="12"><tspan x="584" y="536">CORE candidate: confidence 0.90 or more,</tspan><tspan x="584" y="555">4 evidence, 2 dispatch, 2 summary</tspan></text></svg>