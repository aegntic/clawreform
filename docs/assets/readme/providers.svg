<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img" viewBox="0 0 960 420"><title>Model providers connect to clawreform-runtime along a local lane or a hosted lane.</title><desc>A teal lane for local models that need no API key and an amber lane for hosted providers that need an API key both end at the clawreform-runtime crate.</desc><defs><marker id="arrow" markerHeight="8" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="10" refY="4" viewBox="0 0 10 8"><path fill="#F0A23C" d="M0,0 L10,4 L0,8 Z"/></marker><marker id="arrowTeal" markerHeight="8" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="10" refY="4" viewBox="0 0 10 8"><path fill="#5CC8C2" d="M0,0 L10,4 L0,8 Z"/></marker></defs><rect width="960" height="420" x="0" y="0" fill="#14171C"/><text x="24" y="46" fill="#E6E9EF" font-size="22" font-weight="bold">Model providers: local or hosted</text><g fill="#1C2027" fill-opacity=".55" stroke="#2A303A"><rect width="708" height="118" x="24" y="82" rx="8"/><rect width="708" height="124" x="24" y="238" rx="8"/></g><text x="40" y="102" fill="#5CC8C2" font-size="14" font-weight="bold">Local (no API key)</text><rect width="412" height="70" x="40" y="118" fill="none" stroke="#5CC8C2" stroke-dasharray="5 4" rx="8"/><g><rect width="122" height="40" x="50" y="128" fill="#1C2027" stroke="#2A303A" rx="8"/><text x="111" y="153" fill="#E6E9EF" font-size="14" text-anchor="middle">Ollama</text></g><g><rect width="122" height="40" x="184" y="128" fill="#1C2027" stroke="#2A303A" rx="8"/><text x="245" y="153" fill="#E6E9EF" font-size="14" text-anchor="middle">vLLM</text></g><g><rect width="124" height="40" x="318" y="128" fill="#1C2027" stroke="#2A303A" rx="8"/><text x="380" y="153" fill="#E6E9EF" font-size="14" text-anchor="middle">LM Studio</text></g><g><rect width="220" height="40" x="496" y="128" fill="#1C2027" stroke="#2A303A" rx="8"/><text x="606" y="153" fill="#E6E9EF" font-size="14" text-anchor="middle">OpenAI-compatible driver</text></g><g fill="none" stroke="#5CC8C2" stroke-width="2" marker-end="url(#arrowTeal)"><path d="M452,148 H496"/><path d="M716,148 H760"/></g><text x="40" y="218" fill="#9AA4B2" font-size="12">The model runs on your machine.</text><text x="40" y="258" fill="#F0A23C" font-size="14" font-weight="bold">Hosted (API key)</text><rect width="676" height="76" x="40" y="274" fill="none" stroke="#F0A23C" stroke-dasharray="5 4" rx="8"/><g><rect width="180" height="52" x="50" y="284" fill="#1C2027" stroke="#2A303A" rx="8"/><text x="140" y="305" fill="#E6E9EF" font-size="14" text-anchor="middle">Anthropic</text><text x="140" y="324" fill="#9AA4B2" font-size="12" text-anchor="middle">native driver</text></g><g><rect width="180" height="52" x="244" y="284" fill="#1C2027" stroke="#2A303A" rx="8"/><text x="334" y="305" fill="#E6E9EF" font-size="14" text-anchor="middle">Gemini</text><text x="334" y="324" fill="#9AA4B2" font-size="12" text-anchor="middle">native driver</text></g><g><rect width="268" height="52" x="438" y="284" fill="#1C2027" stroke="#2A303A" rx="8"/><text x="572" y="305" fill="#E6E9EF" font-size="14" text-anchor="middle">23 more providers</text><text x="572" y="324" fill="#9AA4B2" font-size="12" text-anchor="middle">OpenAI-compatible driver</text></g><path fill="none" stroke="#F0A23C" stroke-width="2" marker-end="url(#arrow)" d="M716,310 H760"/><g><rect width="176" height="208" x="760" y="128" fill="#1C2027" stroke="#2A303A" rx="8"/><text x="848" y="237" fill="#E6E9EF" font-size="14" text-anchor="middle">clawreform-runtime</text></g><text x="24" y="390" fill="#9AA4B2" font-size="12">The catalog lists 28 providers: 25 need a key and 3 run locally.</text></svg>