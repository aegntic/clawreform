<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img" viewBox="0 0 960 400"><title>Self-modification plans, applies and validates a change, and can roll it back.</title><desc>A request is classified, planned, backed up, applied and validated, then the change is kept on a pass or the backup is restored on a fail.</desc><defs><marker id="arrow" markerHeight="8" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="10" refY="4" viewBox="0 0 10 8"><path fill="#F0A23C" d="M0,0 L10,4 L0,8 Z"/></marker><marker id="arrowGreen" markerHeight="8" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="10" refY="4" viewBox="0 0 10 8"><path fill="#7CCB8C" d="M0,0 L10,4 L0,8 Z"/></marker><marker id="arrowRose" markerHeight="8" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="10" refY="4" viewBox="0 0 10 8"><path fill="#E06C75" d="M0,0 L10,4 L0,8 Z"/></marker></defs><rect width="960" height="400" x="0" y="0" fill="#14171C"/><text x="24" y="46" fill="#E6E9EF" font-size="22" font-weight="bold">Self-modification: plan, apply, validate, roll back</text><g><rect width="262" height="52" x="24" y="78" fill="#F0A23C" fill-opacity=".1" stroke="#F0A23C" stroke-width="1.5" rx="8"/><text x="155" y="99" fill="#E6E9EF" font-size="14" text-anchor="middle">Request</text><text x="155" y="118" fill="#9AA4B2" font-size="12" text-anchor="middle">Text from the user</text></g><g><rect width="262" height="52" x="349" y="78" fill="#F0A23C" fill-opacity=".1" stroke="#F0A23C" stroke-width="1.5" rx="8"/><text x="480" y="99" fill="#E6E9EF" font-size="14" text-anchor="middle">Classify</text><text x="480" y="118" fill="#9AA4B2" font-size="12" text-anchor="middle">Finds the target area</text></g><g><rect width="262" height="52" x="674" y="78" fill="#F0A23C" fill-opacity=".1" stroke="#F0A23C" stroke-width="1.5" rx="8"/><text x="805" y="99" fill="#E6E9EF" font-size="14" text-anchor="middle">Plan</text><text x="805" y="118" fill="#9AA4B2" font-size="12" text-anchor="middle">Target files and risk</text></g><g><rect width="262" height="52" x="674" y="182" fill="#F0A23C" fill-opacity=".1" stroke="#F0A23C" stroke-width="1.5" rx="8"/><text x="805" y="203" fill="#E6E9EF" font-size="14" text-anchor="middle">Backup</text><text x="805" y="222" fill="#9AA4B2" font-size="12" text-anchor="middle">Copies each target file</text></g><g><rect width="262" height="52" x="349" y="182" fill="#F0A23C" fill-opacity=".1" stroke="#F0A23C" stroke-width="1.5" rx="8"/><text x="480" y="203" fill="#E6E9EF" font-size="14" text-anchor="middle">Apply</text><text x="480" y="222" fill="#9AA4B2" font-size="12" text-anchor="middle">Writes the planned change</text></g><g><rect width="262" height="52" x="24" y="182" fill="#F0A23C" fill-opacity=".1" stroke="#F0A23C" stroke-width="1.5" rx="8"/><text x="155" y="203" fill="#E6E9EF" font-size="14" text-anchor="middle">Validate</text><text x="155" y="222" fill="#9AA4B2" font-size="12" text-anchor="middle">cargo build, test, clippy</text></g><g fill="none" stroke="#F0A23C" stroke-width="2" marker-end="url(#arrow)"><path d="M286,104 H349"/><path d="M611,104 H674"/><path d="M805,130 V182"/><path d="M674,208 H611"/><path d="M349,208 H286"/></g><path fill="none" stroke="#7CCB8C" stroke-width="2" marker-end="url(#arrowGreen)" d="M105,234 V286"/><path fill="none" stroke="#E06C75" stroke-width="2" marker-end="url(#arrowRose)" d="M205,234 V258 H480 V286"/><g><rect width="262" height="44" x="24" y="286" fill="#1C2027" stroke="#7CCB8C" stroke-width="1.5" rx="8"/><text x="155" y="314" fill="#E6E9EF" font-size="14" text-anchor="middle">Pass: keep the change</text></g><g><rect width="262" height="44" x="349" y="286" fill="#1C2027" stroke="#E06C75" stroke-width="1.5" rx="8"/><text x="480" y="314" fill="#E6E9EF" font-size="14" text-anchor="middle">Fail: restore the backup</text></g><text x="24" y="366" fill="#9AA4B2" font-size="12">A plan with high risk requires approval before it is applied.</text></svg>