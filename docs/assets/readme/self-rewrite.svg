<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <title>Self-modification plans, applies and validates a change, and can roll it back.</title>
  <desc>A request is classified, planned, backed up, applied and validated, then the change is kept on a pass or the backup is restored on a fail.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 8" refX="10" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#F0A23C"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 8" refX="10" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#7CCB8C"/>
    </marker>
    <marker id="arrowRose" viewBox="0 0 10 8" refX="10" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#E06C75"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="400" fill="#14171C"/>
  <text x="24" y="46" font-size="22" font-weight="bold" fill="#E6E9EF">Self-modification: plan, apply, validate, roll back</text>

  <!-- Row 1, left to right -->
  <g>
    <rect x="24" y="78" width="262" height="52" rx="8" fill="#F0A23C" fill-opacity="0.1" stroke="#F0A23C" stroke-width="1.5"/>
    <text x="155" y="99" text-anchor="middle" font-size="14" fill="#E6E9EF">Request</text>
    <text x="155" y="118" text-anchor="middle" font-size="12" fill="#9AA4B2">Text from the user</text>
  </g>
  <g>
    <rect x="349" y="78" width="262" height="52" rx="8" fill="#F0A23C" fill-opacity="0.1" stroke="#F0A23C" stroke-width="1.5"/>
    <text x="480" y="99" text-anchor="middle" font-size="14" fill="#E6E9EF">Classify</text>
    <text x="480" y="118" text-anchor="middle" font-size="12" fill="#9AA4B2">Finds the target area</text>
  </g>
  <g>
    <rect x="674" y="78" width="262" height="52" rx="8" fill="#F0A23C" fill-opacity="0.1" stroke="#F0A23C" stroke-width="1.5"/>
    <text x="805" y="99" text-anchor="middle" font-size="14" fill="#E6E9EF">Plan</text>
    <text x="805" y="118" text-anchor="middle" font-size="12" fill="#9AA4B2">Target files and risk</text>
  </g>

  <!-- Row 2, right to left -->
  <g>
    <rect x="674" y="182" width="262" height="52" rx="8" fill="#F0A23C" fill-opacity="0.1" stroke="#F0A23C" stroke-width="1.5"/>
    <text x="805" y="203" text-anchor="middle" font-size="14" fill="#E6E9EF">Backup</text>
    <text x="805" y="222" text-anchor="middle" font-size="12" fill="#9AA4B2">Copies each target file</text>
  </g>
  <g>
    <rect x="349" y="182" width="262" height="52" rx="8" fill="#F0A23C" fill-opacity="0.1" stroke="#F0A23C" stroke-width="1.5"/>
    <text x="480" y="203" text-anchor="middle" font-size="14" fill="#E6E9EF">Apply</text>
    <text x="480" y="222" text-anchor="middle" font-size="12" fill="#9AA4B2">Writes the planned change</text>
  </g>
  <g>
    <rect x="24" y="182" width="262" height="52" rx="8" fill="#F0A23C" fill-opacity="0.1" stroke="#F0A23C" stroke-width="1.5"/>
    <text x="155" y="203" text-anchor="middle" font-size="14" fill="#E6E9EF">Validate</text>
    <text x="155" y="222" text-anchor="middle" font-size="12" fill="#9AA4B2">cargo build, test, clippy</text>
  </g>

  <!-- Flow -->
  <g fill="none" stroke="#F0A23C" stroke-width="2" marker-end="url(#arrow)">
    <path d="M286,104 H349"/>
    <path d="M611,104 H674"/>
    <path d="M805,130 V182"/>
    <path d="M674,208 H611"/>
    <path d="M349,208 H286"/>
  </g>

  <!-- Result of validation -->
  <path d="M105,234 V286" fill="none" stroke="#7CCB8C" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <path d="M205,234 V258 H480 V286" fill="none" stroke="#E06C75" stroke-width="2" marker-end="url(#arrowRose)"/>
  <g>
    <rect x="24" y="286" width="262" height="44" rx="8" fill="#1C2027" stroke="#7CCB8C" stroke-width="1.5"/>
    <text x="155" y="314" text-anchor="middle" font-size="14" fill="#E6E9EF">Pass: keep the change</text>
  </g>
  <g>
    <rect x="349" y="286" width="262" height="44" rx="8" fill="#1C2027" stroke="#E06C75" stroke-width="1.5"/>
    <text x="480" y="314" text-anchor="middle" font-size="14" fill="#E6E9EF">Fail: restore the backup</text>
  </g>

  <text x="24" y="366" font-size="12" fill="#9AA4B2">A plan with high risk requires approval before it is applied.</text>
</svg>
