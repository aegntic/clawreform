<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img" viewBox="0 0 960 560"><title>The 14 clawREFORM crates are grouped in four layers.</title><desc>Amber arrows show the main call path from the Interfaces layer to the kernel, from the kernel to the runtime and the wire crate, and from the runtime to memory.</desc><defs><marker id="arrow" markerHeight="8" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="10" refY="4" viewBox="0 0 10 8"><path fill="#F0A23C" d="M0,0 L10,4 L0,8 Z"/></marker></defs><rect width="960" height="560" x="0" y="0" fill="#14171C"/><text x="24" y="46" fill="#E6E9EF" font-size="22" font-weight="bold">System map: 14 crates in four layers</text><g fill="#1C2027" fill-opacity=".55" stroke="#2A303A"><rect width="912" height="90" x="24" y="62" rx="8"/><rect width="912" height="90" x="24" y="180" rx="8"/><rect width="912" height="90" x="24" y="298" rx="8"/><rect width="912" height="90" x="24" y="416" rx="8"/></g><g fill="#E6E9EF" font-size="14" font-weight="bold"><text x="40" y="82">Interfaces</text><text x="40" y="200">Core</text><text x="40" y="318">Capabilities</text><text x="40" y="436">Network and tools</text></g><g><rect width="261" height="52" x="40" y="92" fill="#1C2027" stroke="#2A303A" rx="8"/><text x="170.5" y="113" fill="#E6E9EF" font-size="14" text-anchor="middle">clawreform-cli</text><text x="170.5" y="132" fill="#9AA4B2" font-size="12" text-anchor="middle">CLI, TUI and MCP server</text></g><g><rect width="261" height="52" x="349" y="92" fill="#1C2027" stroke="#2A303A" rx="8"/><text x="479.5" y="113" fill="#E6E9EF" font-size="14" text-anchor="middle">clawreform-desktop</text><text x="479.5" y="132" fill="#9AA4B2" font-size="12" text-anchor="middle">Tauri desktop app</text></g><g><rect width="262" height="52" x="658" y="92" fill="#1C2027" stroke="#2A303A" rx="8"/><text x="789" y="113" fill="#E6E9EF" font-size="14" text-anchor="middle">clawreform-api</text><text x="789" y="132" fill="#9AA4B2" font-size="12" text-anchor="middle">REST, WebSocket and SSE API</text></g><g><rect width="206" height="52" x="40" y="210" fill="#1C2027" stroke="#2A303A" rx="8"/><text x="143" y="231" fill="#E6E9EF" font-size="14" text-anchor="middle">clawreform-kernel</text><text x="143" y="250" fill="#9AA4B2" font-size="12" text-anchor="middle">Assembles the subsystems</text></g><g><rect width="209" height="52" x="290" y="210" fill="#1C2027" stroke="#2A303A" rx="8"/><text x="394.5" y="231" fill="#E6E9EF" font-size="14" text-anchor="middle">clawreform-runtime</text><text x="394.5" y="250" fill="#9AA4B2" font-size="12" text-anchor="middle">Agent loop and LLM drivers</text></g><g><rect width="190" height="52" x="543" y="210" fill="#1C2027" stroke="#2A303A" rx="8"/><text x="638" y="231" fill="#E6E9EF" font-size="14" text-anchor="middle">clawreform-memory</text><text x="638" y="250" fill="#9AA4B2" font-size="12" text-anchor="middle">SQLite memory store</text></g><g><rect width="160" height="52" x="760" y="210" fill="#1C2027" stroke="#2A303A" rx="8"/><text x="840" y="231" fill="#E6E9EF" font-size="14" text-anchor="middle">clawreform-types</text><text x="840" y="250" fill="#9AA4B2" font-size="12" text-anchor="middle">Shared types</text></g><g><rect width="151" height="52" x="40" y="328" fill="#1C2027" stroke="#2A303A" rx="8"/><text x="115.5" y="349" fill="#E6E9EF" font-size="14" text-anchor="middle">clawreform-hands</text><text x="115.5" y="368" fill="#9AA4B2" font-size="12" text-anchor="middle">Action packages</text></g><g><rect width="142" height="52" x="227" y="328" fill="#1C2027" stroke="#2A303A" rx="8"/><text x="298" y="349" fill="#E6E9EF" font-size="14" text-anchor="middle">clawreform-skills</text><text x="298" y="368" fill="#9AA4B2" font-size="12" text-anchor="middle">Skills</text></g><g><rect width="184" height="52" x="383" y="328" fill="#1C2027" stroke="#2A303A" rx="8"/><text x="475" y="349" fill="#E6E9EF" font-size="14" text-anchor="middle">clawreform-extensions</text><text x="475" y="368" fill="#9AA4B2" font-size="12" text-anchor="middle">Integrations and vault</text></g><g><rect width="172" height="52" x="581" y="328" fill="#1C2027" stroke="#2A303A" rx="8"/><text x="667" y="349" fill="#E6E9EF" font-size="14" text-anchor="middle">clawreform-channels</text><text x="667" y="368" fill="#9AA4B2" font-size="12" text-anchor="middle">Messaging adapters</text></g><g><rect width="152" height="52" x="768" y="328" fill="#1C2027" stroke="#2A303A" rx="8"/><text x="844" y="349" fill="#E6E9EF" font-size="14" text-anchor="middle">clawreform-teams</text><text x="844" y="368" fill="#9AA4B2" font-size="12" text-anchor="middle">Multi-agent teams</text></g><g><rect width="261" height="52" x="40" y="446" fill="#1C2027" stroke="#2A303A" rx="8"/><text x="170.5" y="467" fill="#E6E9EF" font-size="14" text-anchor="middle">clawreform-wire</text><text x="170.5" y="486" fill="#9AA4B2" font-size="12" text-anchor="middle">Peer-to-peer protocol</text></g><g><rect width="261" height="52" x="349" y="446" fill="#1C2027" stroke="#2A303A" rx="8"/><text x="479.5" y="467" fill="#E6E9EF" font-size="14" text-anchor="middle">clawreform-migrate</text><text x="479.5" y="486" fill="#9AA4B2" font-size="12" text-anchor="middle">Import from OpenClaw</text></g><g fill="none" stroke="#F0A23C" stroke-width="2" marker-end="url(#arrow)"><path d="M143,152 V210"/><path d="M246,236 H290"/><path d="M499,236 H543"/><path d="M143,262 V284 H209 V446"/></g><text x="24" y="528" fill="#9AA4B2" font-size="12">The arrows show the main call path. The crates also connect in other ways.</text></svg>