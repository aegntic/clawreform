<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <title>The 14 clawREFORM crates are grouped in four layers.</title>
  <desc>Amber arrows show the main call path from the Interfaces layer to the kernel, from the kernel to the runtime and the wire crate, and from the runtime to memory.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 8" refX="10" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#F0A23C"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="560" fill="#14171C"/>
  <text x="24" y="46" font-size="22" font-weight="bold" fill="#E6E9EF">System map: 14 crates in four layers</text>

  <!-- Layer panels -->
  <g fill="#1C2027" fill-opacity="0.55" stroke="#2A303A">
    <rect x="24" y="62" width="912" height="90" rx="8"/>
    <rect x="24" y="180" width="912" height="90" rx="8"/>
    <rect x="24" y="298" width="912" height="90" rx="8"/>
    <rect x="24" y="416" width="912" height="90" rx="8"/>
  </g>

  <!-- Layer headings -->
  <g font-size="14" font-weight="bold" fill="#E6E9EF">
    <text x="40" y="82">Interfaces</text>
    <text x="40" y="200">Core</text>
    <text x="40" y="318">Capabilities</text>
    <text x="40" y="436">Network and tools</text>
  </g>

  <!-- Interfaces -->
  <g>
    <rect x="40" y="92" width="261" height="52" rx="8" fill="#1C2027" stroke="#2A303A"/>
    <text x="170.5" y="113" text-anchor="middle" font-size="14" fill="#E6E9EF">clawreform-cli</text>
    <text x="170.5" y="132" text-anchor="middle" font-size="12" fill="#9AA4B2">CLI, TUI and MCP server</text>
  </g>
  <g>
    <rect x="349" y="92" width="261" height="52" rx="8" fill="#1C2027" stroke="#2A303A"/>
    <text x="479.5" y="113" text-anchor="middle" font-size="14" fill="#E6E9EF">clawreform-desktop</text>
    <text x="479.5" y="132" text-anchor="middle" font-size="12" fill="#9AA4B2">Tauri desktop app</text>
  </g>
  <g>
    <rect x="658" y="92" width="262" height="52" rx="8" fill="#1C2027" stroke="#2A303A"/>
    <text x="789" y="113" text-anchor="middle" font-size="14" fill="#E6E9EF">clawreform-api</text>
    <text x="789" y="132" text-anchor="middle" font-size="12" fill="#9AA4B2">REST, WebSocket and SSE API</text>
  </g>

  <!-- Core -->
  <g>
    <rect x="40" y="210" width="206" height="52" rx="8" fill="#1C2027" stroke="#2A303A"/>
    <text x="143" y="231" text-anchor="middle" font-size="14" fill="#E6E9EF">clawreform-kernel</text>
    <text x="143" y="250" text-anchor="middle" font-size="12" fill="#9AA4B2">Assembles the subsystems</text>
  </g>
  <g>
    <rect x="290" y="210" width="209" height="52" rx="8" fill="#1C2027" stroke="#2A303A"/>
    <text x="394.5" y="231" text-anchor="middle" font-size="14" fill="#E6E9EF">clawreform-runtime</text>
    <text x="394.5" y="250" text-anchor="middle" font-size="12" fill="#9AA4B2">Agent loop and LLM drivers</text>
  </g>
  <g>
    <rect x="543" y="210" width="190" height="52" rx="8" fill="#1C2027" stroke="#2A303A"/>
    <text x="638" y="231" text-anchor="middle" font-size="14" fill="#E6E9EF">clawreform-memory</text>
    <text x="638" y="250" text-anchor="middle" font-size="12" fill="#9AA4B2">SQLite memory store</text>
  </g>
  <g>
    <rect x="760" y="210" width="160" height="52" rx="8" fill="#1C2027" stroke="#2A303A"/>
    <text x="840" y="231" text-anchor="middle" font-size="14" fill="#E6E9EF">clawreform-types</text>
    <text x="840" y="250" text-anchor="middle" font-size="12" fill="#9AA4B2">Shared types</text>
  </g>

  <!-- Capabilities -->
  <g>
    <rect x="40" y="328" width="151" height="52" rx="8" fill="#1C2027" stroke="#2A303A"/>
    <text x="115.5" y="349" text-anchor="middle" font-size="14" fill="#E6E9EF">clawreform-hands</text>
    <text x="115.5" y="368" text-anchor="middle" font-size="12" fill="#9AA4B2">Action packages</text>
  </g>
  <g>
    <rect x="227" y="328" width="142" height="52" rx="8" fill="#1C2027" stroke="#2A303A"/>
    <text x="298" y="349" text-anchor="middle" font-size="14" fill="#E6E9EF">clawreform-skills</text>
    <text x="298" y="368" text-anchor="middle" font-size="12" fill="#9AA4B2">Skills</text>
  </g>
  <g>
    <rect x="383" y="328" width="184" height="52" rx="8" fill="#1C2027" stroke="#2A303A"/>
    <text x="475" y="349" text-anchor="middle" font-size="14" fill="#E6E9EF">clawreform-extensions</text>
    <text x="475" y="368" text-anchor="middle" font-size="12" fill="#9AA4B2">Integrations and vault</text>
  </g>
  <g>
    <rect x="581" y="328" width="172" height="52" rx="8" fill="#1C2027" stroke="#2A303A"/>
    <text x="667" y="349" text-anchor="middle" font-size="14" fill="#E6E9EF">clawreform-channels</text>
    <text x="667" y="368" text-anchor="middle" font-size="12" fill="#9AA4B2">Messaging adapters</text>
  </g>
  <g>
    <rect x="768" y="328" width="152" height="52" rx="8" fill="#1C2027" stroke="#2A303A"/>
    <text x="844" y="349" text-anchor="middle" font-size="14" fill="#E6E9EF">clawreform-teams</text>
    <text x="844" y="368" text-anchor="middle" font-size="12" fill="#9AA4B2">Multi-agent teams</text>
  </g>

  <!-- Network and tools -->
  <g>
    <rect x="40" y="446" width="261" height="52" rx="8" fill="#1C2027" stroke="#2A303A"/>
    <text x="170.5" y="467" text-anchor="middle" font-size="14" fill="#E6E9EF">clawreform-wire</text>
    <text x="170.5" y="486" text-anchor="middle" font-size="12" fill="#9AA4B2">Peer-to-peer protocol</text>
  </g>
  <g>
    <rect x="349" y="446" width="261" height="52" rx="8" fill="#1C2027" stroke="#2A303A"/>
    <text x="479.5" y="467" text-anchor="middle" font-size="14" fill="#E6E9EF">clawreform-migrate</text>
    <text x="479.5" y="486" text-anchor="middle" font-size="12" fill="#9AA4B2">Import from OpenClaw</text>
  </g>

  <!-- Main call path -->
  <g fill="none" stroke="#F0A23C" stroke-width="2" marker-end="url(#arrow)">
    <path d="M143,152 V210"/>
    <path d="M246,236 H290"/>
    <path d="M499,236 H543"/>
    <path d="M143,262 V284 H209 V446"/>
  </g>

  <text x="24" y="528" font-size="12" fill="#9AA4B2">The arrow shows the main call path. The crates also connect in other ways.</text>
</svg>
